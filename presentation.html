<!doctype html><html><head><meta charset="utf-8"><title>Präsentation wird geladen…</title><style>html,body{margin:0;width:100%;height:100%;background:#080d1c;color:white;font-family:Arial,sans-serif;display:grid;place-items:center}.l{opacity:.7}</style></head><body><div class="l">Präsentation wird geladen…</div><script>(async()=>{const n=10;const ps=[];for(let i=1;i<=n;i++){ps.push(fetch(`presentation_parts/p${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}))}const h=(await Promise.all(ps)).join('');document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<div class="l">Präsentation konnte nicht geladen werden.</div>';console.error(e)})</script></body></html>
