name: One-time PDF lock modal

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/add_pdf_lock_modal.py'
      - '.github/workflows/one-time-pdf-lock-modal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Add PDF lock modal
        run: python .github/scripts/add_pdf_lock_modal.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          a = s.find(marker)
          b = s.rfind('</script>')
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('main script not found')
          Path('/tmp/app.js').write_text(s[a + len('  <script>\n'):b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/add_pdf_lock_modal.py .github/workflows/one-time-pdf-lock-modal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/add_pdf_lock_modal.py .github/workflows/one-time-pdf-lock-modal.yml
          git commit -m 'fix: show PDF lock as modal'
          git push origin HEAD:dev
