name: One-time minimum prompt criteria update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-minimum-prompt-criteria.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update learner prompt criteria
        shell: python
        run: |
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '<pre class="prompt-code"><code>Schreibe deinen Prompt selbst.'
          start = text.index(start_marker)
          body_start = start + len('<pre class="prompt-code"><code>')
          end = text.index('</code></pre>', body_start)
          new = base64.b64decode('').decode('utf-8')
          text = text[:body_start] + new + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Extract app JavaScript
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          start = text.index(marker) + len('  <script>\n')
          end = text.rindex('\n  </script>')
          Path('/tmp/ib-start-app.js').write_text(text[start:end], encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check /tmp/ib-start-app.js

      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-time-minimum-prompt-criteria.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-minimum-prompt-criteria.yml
          git commit -m "fix: focus prompt help on content criteria"
          git push origin main
