name: One-time student identity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch name and class prompts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''              <strong data-student-name>Vorname</strong>\n              <span>Klasse B25</span>''',
                  '''              <strong data-student-name>Name</strong>\n              <span data-student-class>Klasse</span>'''
              ),
              (
                  '''      const studentNameEl = document.querySelector("[data-student-name]");\n      const currentDateEl = document.querySelector("[data-current-date]");''',
                  '''      const studentNameEl = document.querySelector("[data-student-name]");\n      const studentClassEl = document.querySelector("[data-student-class]");\n      const currentDateEl = document.querySelector("[data-current-date]");'''
              ),
              (
                  '''      let studentFirstName = typeof saved.studentFirstName === "string" ? saved.studentFirstName.trim() : "";\n      if (!studentFirstName) {\n        studentFirstName = (window.prompt("Vorname?") || "").trim();\n        if (studentFirstName) {\n          const next = readSaved();\n          next.studentFirstName = studentFirstName;\n          writeSaved(next);\n        }\n      }\n\n      if (studentNameEl) studentNameEl.textContent = studentFirstName || "Vorname";\n      if (currentDateEl) currentDateEl.textContent = formatDate(new Date());''',
                  '''      let studentName = typeof saved.studentName === "string" ? saved.studentName.trim() : "";\n      if (!studentName && typeof saved.studentFirstName === "string") studentName = saved.studentFirstName.trim();\n      if (!studentName) {\n        studentName = (window.prompt("Name?") || "").trim();\n        if (studentName) {\n          const next = readSaved();\n          next.studentName = studentName;\n          next.studentFirstName = studentName;\n          writeSaved(next);\n        }\n      }\n\n      let studentClass = typeof saved.studentClass === "string" ? saved.studentClass.trim() : "";\n      if (!studentClass) {\n        studentClass = (window.prompt("Klasse?") || "").trim().replace(/^klasse\\s+/i, "");\n        if (studentClass) {\n          const next = readSaved();\n          next.studentClass = studentClass;\n          writeSaved(next);\n        }\n      }\n\n      if (studentNameEl) studentNameEl.textContent = studentName || "Name";\n      if (studentClassEl) studentClassEl.textContent = studentClass ? `Klasse ${studentClass}` : "Klasse";\n      if (currentDateEl) currentDateEl.textContent = formatDate(new Date());'''
              ),
              (
                  '''          studentFirstName: studentFirstName || "",''',
                  '''          studentName: studentName || "",\n          studentFirstName: studentName || "",\n          studentClass: studentClass || "",'''
              ),
              (
                  '''        const safeName = (studentFirstName || "schueler").toLowerCase().replace(/[^a-z0-9_-]+/gi, "-");''',
                  '''        const safeName = (studentName || "schueler").toLowerCase().replace(/[^a-z0-9_-]+/gi, "-");'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-student-meta-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-student-meta-fix.yml
          git commit -m "fix: ask for student name and class"
          git push
