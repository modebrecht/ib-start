name: One-time shortcut and mail polish

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/polish_shortcuts_mail.py'
      - '.github/workflows/one-time-shortcuts-mail-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply UI polish
        run: python .github/scripts/polish_shortcuts_mail.py
      - name: Validate main JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<script>\n    (() => {'
          a=s.find(marker)
          assert a >= 0
          a += len('<script>\n')
          b=s.find('</script>', a)
          assert b > a
          Path('/tmp/app.js').write_text(s[a:b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validate markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'class="submission-paperclip"' in s
          assert '<span>ODER</span>' in s
          assert 'vorname.nachname@sus.gsu-so.ch' in s
          assert s.count('class="runner-shortcut') >= 3
          PY
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/polish_shortcuts_mail.py .github/workflows/one-time-shortcuts-mail-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/polish_shortcuts_mail.py .github/workflows/one-time-shortcuts-mail-polish.yml
          git commit -m 'fix: group key hints and clarify mail submission'
          git push origin HEAD:dev
