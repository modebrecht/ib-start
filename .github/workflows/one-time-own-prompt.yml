name: One-time own prompt update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-own-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace copy-paste prompt with learner guidance
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '            <details class="prompt-box">\n'
          end_marker = '            </details>\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = base64.b64decode('').decode('utf-8')
          text = text[:start] + replacement + text[end:]

          js_start_marker = '      const copyPromptButton = document.querySelector("[data-copy-prompt]");\n'
          js_end_marker = '\n\n      const htmlRunnerInput = document.querySelector("[data-html-runner-input]");'
          js_start = text.index(js_start_marker)
          js_end = text.index(js_end_marker, js_start)
          text = text[:js_start] + text[js_end + 2:]

          assert 'Prompt kopieren' not in text
          assert 'data-copy-prompt' not in text
          assert 'data-prompt-code' not in text
          assert 'Schreibe deinen Prompt selbst.' in text

          path.write_text(text, encoding='utf-8')

      - name: Extract app JavaScript
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          start = text.index(marker) + len('  <script>\n')
          end = text.rindex('\n  </script>')
          Path('/tmp/ib-start-app.js').write_text(text[start:end], encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check /tmp/ib-start-app.js

      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-time-own-prompt.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-own-prompt.yml
          git commit -m "feat: make students write their own AI prompt"
          git push origin main
