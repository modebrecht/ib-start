name: One-time lesson flow cleanup

on:
  push:
    branches: [cleanup-lesson-flow]
    paths:
      - '.github/workflows/one-time-cleanup-lesson-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-lesson-flow
          fetch-depth: 0

      - name: Simplify lesson flow
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(old_b64, new_b64, label):
              global text
              old = dec(old_b64)
              new = dec(new_b64)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected once, found {count}')
              text = text.replace(old, new, 1)

          # Remove duplicate reflection from task 02.
          replace_once(
              '',
              '',
              'task 02 reflection'
          )

          # Remove redundant shortcut reflection from task 07.
          replace_once(
              '',
              '',
              'task 07 reflection'
          )

          # Integrate prompt practice into task 01 after the help block.
          replace_once(
              'ICAgICAgICAgICAgPC9kZXRhaWxzPgogICAgICAgICAgPC9kaXY+CiAgICAgICAgPC9kaXY+CiAgICAgIDwvc2VjdGlvbj4KCiAgICAgIDxzZWN0aW9uIGNsYXNzPSJzZWN0aW9uIiBkYXRhLXRhc2s9InRhc2stMiI=',
              '',
              'task 01 prompt integration'
          )

          # Remove standalone task 05 section.
          replace_once(
              '',
              '',
              'standalone task 05'
          )

          # Remove task 05 tile and renumber visible tasks 06-08 to 05-07.
          replace_once('ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay01IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS1ibHVlKSI+PHNwYW4gY2xhc3M9InRhc2stbnVtYmVyIj4wNTwvc3Bhbj48c3BhbiBjbGFzcz0idGFzay1sYWJlbCI+S0kgcmljaHRpZyBudXR6ZW48L3NwYW4+PC9idXR0b24+Cg==', '', 'task 05 tile')
          replace_once('ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay02IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS1pbmRpZ28pIj48c3BhbiBjbGFzcz0idGFzay1udW1iZXIiPjA2PC9zcGFuPjxzcGFuIGNsYXNzPSJ0YXNrLWxhYmVsIj5XYXMgZGFyZiBpY2ggdGVpbGVuPzwvc3Bhbj48L2J1dHRvbj4=', 'ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay02IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS1pbmRpZ28pIj48c3BhbiBjbGFzcz0idGFzay1udW1iZXIiPjA1PC9zcGFuPjxzcGFuIGNsYXNzPSJ0YXNrLWxhYmVsIj5XYXMgZGFyZiBpY2ggdGVpbGVuPzwvc3Bhbj48L2J1dHRvbj4=', 'task 06 tile number')
          replace_once('ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay03IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS12aW9sZXQpIj48c3BhbiBjbGFzcz0idGFzay1udW1iZXIiPjA3PC9zcGFuPjxzcGFuIGNsYXNzPSJ0YXNrLWxhYmVsIj5XZXJremV1Z2U6IFRhc3RlbmtvbWJpbmF0aW9uZW48L3NwYW4+PC9idXR0b24+=', 'ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay03IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS12aW9sZXQpIj48c3BhbiBjbGFzcz0idGFzay1udW1iZXIiPjA2PC9zcGFuPjxzcGFuIGNsYXNzPSJ0YXNrLWxhYmVsIj5XZXJremV1Z2U6IFRhc3RlbmtvbWJpbmF0aW9uZW48L3NwYW4+PC9idXR0b24+=', 'task 07 tile number')
          replace_once('ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay04IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS1jeWFuKSI+PHNwYW4gY2xhc3M9InRhc2stbnVtYmVyIj4wODwvc3Bhbj48c3BhbiBjbGFzcz0idGFzay1sYWJlbCI+UsO8Y2tibGljazwvc3Bhbj48L2J1dHRvbj4=', 'ICAgICAgICA8YnV0dG9uIGNsYXNzPSJ0YXNrLXRpbGUiIHR5cGU9ImJ1dHRvbiIgZGF0YS10YXNrLXRhcmdldD0idGFzay04IiBzdHlsZT0iLS10aWxlLWNvbG9yOiB2YXIoLS1jeWFuKSI+PHNwYW4gY2xhc3M9InRhc2stbnVtYmVyIj4wNzwvc3Bhbj48c3BhbiBjbGFzcz0idGFzay1sYWJlbCI+UsO8Y2tibGljazwvc3Bhbj48L2J1dHRvbj4=', 'task 08 tile number')

          # Renumber visible section badges for the remaining tasks.
          text = text.replace('<section class="section" data-task="task-6" style="--accent: var(--indigo)">\n        <div class="section-number"><span>06</span><span>◉</span></div>', '<section class="section" data-task="task-6" style="--accent: var(--indigo)">\n        <div class="section-number"><span>05</span><span>◉</span></div>', 1)
          text = text.replace('<section class="section" data-task="task-7" style="--accent: var(--violet)">\n        <div class="section-number"><span>07</span><span>⌨</span></div>', '<section class="section" data-task="task-7" style="--accent: var(--violet)">\n        <div class="section-number"><span>06</span><span>⌨</span></div>', 1)
          text = text.replace('<section class="section" data-task="task-8" style="--accent: var(--cyan)">\n        <div class="section-number"><span>08</span><span>✓</span></div>', '<section class="section" data-task="task-8" style="--accent: var(--cyan)">\n        <div class="section-number"><span>07</span><span>✓</span></div>', 1)

          # Prompt check now gates task 01 instead of removed task 05.
          old_needs = '      const taskNeedsSolved = (taskId) => taskId === "task-3" || taskId === "task-4" || taskId === "task-5" || taskId === "task-6" || taskId === "task-7";'
          new_needs = '      const taskNeedsSolved = (taskId) => taskId === "task-1" || taskId === "task-3" || taskId === "task-4" || taskId === "task-6" || taskId === "task-7";'
          if old_needs not in text:
              raise SystemExit('taskNeedsSolved marker missing')
          text = text.replace(old_needs, new_needs, 1)

          old_prompt = dec('')
          new_prompt = dec('')
          if text.count(old_prompt) != 1:
              raise SystemExit(f'prompt JS block expected once, found {text.count(old_prompt)}')
          text = text.replace(old_prompt, new_prompt, 1)

          text = text.replace('setCheckStatus("task-7", "Gespeichert: Aufgabe 07 ist richtig gelöst.", "success");', 'setCheckStatus("task-7", "Gespeichert: Aufgabe 06 ist richtig gelöst.", "success");', 1)

          if 'data-task-target="task-5"' in text or 'data-task="task-5"' in text:
              raise SystemExit('Standalone task 05 still present')
          if 'name="worked-well"' in text or 'name="most-used"' in text:
              raise SystemExit('Redundant reflection fields still present')
          if 'data-check-task="task-1-prompt"' not in text:
              raise SystemExit('Integrated prompt check missing')

          path.write_text(text, encoding='utf-8')

      - name: Extract app JavaScript
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          start = text.index(marker) + len('  <script>\n')
          end = text.rindex('\n  </script>')
          Path('/tmp/ib-start-app.js').write_text(text[start:end], encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check /tmp/ib-start-app.js

      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-time-cleanup-lesson-flow.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-cleanup-lesson-flow.yml
          git commit -m "refactor: simplify first lesson flow"
          git push origin cleanup-lesson-flow
