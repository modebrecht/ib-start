name: One-time mail submission task

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-add-mail-submission.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Add mail submission task
        run: python .github/scripts/add-mail-submission.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/add-mail-submission.py
          rm -f .github/workflows/one-time-add-mail-submission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts .github/workflows
          git commit -m "feat: add mail submission task"
          git push origin HEAD:dev
