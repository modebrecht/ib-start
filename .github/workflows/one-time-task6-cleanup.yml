name: One-time task 6 cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/simplify_task6_and_hide_json.py'
      - '.github/workflows/one-time-task6-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply task 6 cleanup
        run: python .github/scripts/simplify_task6_and_hide_json.py
      - name: Validate main JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<script>\n    (() => {'
          a=s.find(marker)
          assert a >= 0
          a += len('<script>\n')
          b=s.find('</script>', a)
          assert b > a
          Path('/tmp/app.js').write_text(s[a:b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validate cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Hilfe für deinen Prompt anzeigen' not in s
          assert 'Meine Präsentation ist fertig und gespeichert.' not in s
          assert 'class="prompt-box prompt-box-static"' in s
          assert 'class="download-json settings-json"' in s
          assert '<div class="final-actions" data-final-actions>' not in s
          PY
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/simplify_task6_and_hide_json.py .github/workflows/one-time-task6-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/simplify_task6_and_hide_json.py .github/workflows/one-time-task6-cleanup.yml
          git commit -m 'fix: simplify presentation task and hide JSON export'
          git push origin HEAD:dev
