name: One-time action button SVGs

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/add-action-button-icons.py'
      - '.github/workflows/one-time-action-button-icons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply action button icons
        run: python .github/scripts/add-action-button-icons.py
      - name: Validate main JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          assert scripts, 'no inline script found'
          Path('/tmp/ib-start-main.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/ib-start-main.js
      - name: Validate action icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          buttons = re.findall(r'<button class="check-button"[^>]*>(.*?)</button>', text, flags=re.S)
          assert buttons and all('<svg' in b for b in buttons), 'a check button is missing its SVG'
          for token in ['data-read-confirm="task-1-brief"','data-download-json','data-admin-unlock','data-settings-toggle']:
              pos = text.find(token)
              assert pos >= 0, token
              start = text.rfind('<button', 0, pos)
              end = text.find('</button>', pos)
              assert '<svg' in text[start:end], f'{token} missing SVG'
          PY
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/add-action-button-icons.py .github/workflows/one-time-action-button-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/add-action-button-icons.py .github/workflows/one-time-action-button-icons.yml
          git commit -m 'fix: add SVG icons to action buttons'
          git push origin HEAD:dev
