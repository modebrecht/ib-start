name: One-time header subtitle update

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-update-header-subtitle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update subtitle
        run: python .github/scripts/update_header_subtitle.py
      - name: Commit final change and remove one-time tooling
        run: |
          rm .github/scripts/update_header_subtitle.py
          rm .github/workflows/one-time-update-header-subtitle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clarify IB header subtitle"
          git push origin dev
