name: One-time reorder lesson

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-reorder-lesson.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply lesson reorder
        run: python .github/scripts/reorder_lesson.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', text)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit final change and remove one-time files
        run: |
          rm .github/scripts/reorder_lesson.py
          rm .github/workflows/one-time-reorder-lesson.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: reorder lesson around final presentation"
          git push origin dev
