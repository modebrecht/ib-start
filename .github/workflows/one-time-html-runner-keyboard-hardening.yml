name: One-time HTML runner keyboard hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-html-runner-keyboard-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden presentation keyboard routing
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_dispatch = 'window.dispatchEvent(new KeyboardEvent("keydown", {'
          if text.count(old_dispatch) != 2:
              raise SystemExit(f'Expected two presentation key dispatches, found {text.count(old_dispatch)}')
          text = text.replace(old_dispatch, 'document.dispatchEvent(new KeyboardEvent("keydown", {')

          old_escape = '''        if (event.key === "Escape") {
          event.preventDefault();
          closePresentation();
          return;
        }'''
          new_escape = '''        if (event.key === "Escape") {
          event.preventDefault();
          event.stopImmediatePropagation();
          closePresentation();
          return;
        }'''
          if text.count(old_escape) != 1:
              raise SystemExit(f'Expected parent Escape block once, found {text.count(old_escape)}')
          text = text.replace(old_escape, new_escape, 1)

          old_keys = '''        if (["ArrowLeft", "ArrowRight", "ArrowDown", " "].includes(event.key)) {
          event.preventDefault();
          presentationFrame?.contentWindow?.postMessage({'''
          new_keys = '''        if (["ArrowLeft", "ArrowRight", "ArrowDown", " "].includes(event.key)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          presentationFrame?.contentWindow?.postMessage({'''
          if text.count(old_keys) != 1:
              raise SystemExit(f'Expected parent navigation block once, found {text.count(old_keys)}')
          text = text.replace(old_keys, new_keys, 1)

          path.write_text(text, encoding='utf-8')

      - name: Extract and check app JavaScript
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          start = text.index(marker) + len('  <script>\n')
          end = text.rindex('\n  </script>')
          Path('/tmp/ib-start-app.js').write_text(text[start:end], encoding='utf-8')
      - run: node --check /tmp/ib-start-app.js

      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-time-html-runner-keyboard-hardening.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-html-runner-keyboard-hardening.yml
          git commit -m "fix: harden HTML presentation keyboard routing"
          git push origin main
