name: One-time header meta polish

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/polish_header_meta.py'
      - '.github/workflows/one-time-polish-header-meta.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply header meta polish
        run: python .github/scripts/polish_header_meta.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='  <script>\n    (() => {'
          a=s.index(marker) + len('  <script>\n')
          b=s.rfind('\n  </script>')
          Path('/tmp/app.js').write_text(s[a:b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/polish_header_meta.py .github/workflows/one-time-polish-header-meta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/polish_header_meta.py .github/workflows/one-time-polish-header-meta.yml
          git commit -m 'fix: polish student meta header'
          git push origin HEAD:dev
