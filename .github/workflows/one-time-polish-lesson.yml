name: One-time polish lesson

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-polish-lesson.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply lesson polish
        run: |
          sed -i 's/!= 16/!= 18/; s/Expected 16 privacy options/Expected 18 privacy markers/' .github/scripts/polish-lesson-flow.py
          python .github/scripts/polish-lesson-flow.py
          python .github/scripts/fix-first-lesson-wording.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit final changes and remove one-time tooling
        run: |
          rm -f .github/scripts/polish-lesson-flow.py
          rm -f .github/scripts/fix-first-lesson-wording.py
          rm -f .github/workflows/one-time-polish-lesson.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts .github/workflows
          git commit -m "refactor: polish lesson order and visual flow"
          git push origin HEAD:dev
