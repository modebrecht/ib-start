name: One-time HTML presentation runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-html-presentation-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add HTML presentation runner
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          decode = lambda value: base64.b64decode(value).decode("utf-8")

          css = decode("")
          runner_html = decode("")
          overlay_html = decode("")
          runner_js = decode("...TRUNCATED...==")

          css_marker = "    .slide-controls {"
          if text.count(css_marker) != 1:
              raise SystemExit(f"Expected CSS marker once, found {text.count(css_marker)}")
          text = text.replace(css_marker, css + css_marker, 1)

          old_button_selector = 'button:not(.match-item):not(.task-tile):not(.round-nav):not(.print-final):not(.copy-prompt):not(.check-button):not(.read-button):not(.settings-button):not(.admin-unlock) {'
          new_button_selector = 'button:not(.match-item):not(.task-tile):not(.round-nav):not(.print-final):not(.copy-prompt):not(.check-button):not(.read-button):not(.settings-button):not(.admin-unlock):not(.html-runner-start):not(.presentation-back) {'
          if text.count(old_button_selector) != 1:
              raise SystemExit(f"Expected generic button selector once, found {text.count(old_button_selector)}")
          text = text.replace(old_button_selector, new_button_selector, 1)

          task2_start = text.index('<section class="section" data-task="task-2"')
          task3_start = text.index('<section class="section" data-task="task-3"', task2_start)
          task2 = text[task2_start:task3_start]
          task2_tail = "          </div>\n        </div>\n      </section>"
          tail_pos = task2.rfind(task2_tail)
          if tail_pos == -1:
              raise SystemExit("Could not find task 02 section-content closing marker")
          task2 = task2[:tail_pos] + runner_html + task2[tail_pos:]
          text = text[:task2_start] + task2 + text[task3_start:]

          old_prompt_line = "- Navigation mit Pfeiltasten und Buttons."
          new_prompt_line = "- Navigation: Pfeiltaste rechts, Pfeiltaste runter oder Leertaste = nächste Folie; Pfeiltaste links = vorherige Folie; zusätzlich sichtbare Buttons."
          if text.count(old_prompt_line) != 1:
              raise SystemExit(f"Expected prompt navigation line once, found {text.count(old_prompt_line)}")
          text = text.replace(old_prompt_line, new_prompt_line, 1)

          form_marker = "  </form>\n  <script>"
          if text.count(form_marker) != 1:
              raise SystemExit(f"Expected form/script marker once, found {text.count(form_marker)}")
          text = text.replace(form_marker, "  </form>" + overlay_html + "  <script>", 1)

          old_fields = '''const fields = form ? [...form.querySelectorAll('input:not([data-theme-toggle]):not([type="password"]):not([type="range"]), textarea')] : [];'''
          new_fields = '''const fields = form ? [...form.querySelectorAll('input:not([data-theme-toggle]):not([type="password"]):not([type="range"]):not([data-no-store]), textarea:not([data-no-store])')] : [];'''
          if text.count(old_fields) != 1:
              raise SystemExit(f"Expected fields selector once, found {text.count(old_fields)}")
          text = text.replace(old_fields, new_fields, 1)

          old_complete = '''const textFields = [...task.querySelectorAll('input[type="text"], input[type="date"], textarea')];'''
          new_complete = '''const textFields = [...task.querySelectorAll('input[type="text"]:not([data-ignore-completion]), input[type="date"]:not([data-ignore-completion]), textarea:not([data-ignore-completion])')];'''
          if text.count(old_complete) != 1:
              raise SystemExit(f"Expected completion selector once, found {text.count(old_complete)}")
          text = text.replace(old_complete, new_complete, 1)

          js_marker = "      const fieldKey = (field, index) => {"
          if text.count(js_marker) != 1:
              raise SystemExit(f"Expected JS marker once, found {text.count(js_marker)}")
          text = text.replace(js_marker, runner_js + js_marker, 1)

          required = [
              'data-html-runner-input',
              'data-presentation-stage',
              'sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-presentation"',
              'ib-presentation-exit',
              'nativePresentationFullscreen',
              'textarea:not([data-no-store])',
              'textarea:not([data-ignore-completion])',
              'Pfeiltaste runter oder Leertaste = nächste Folie'
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"Missing expected runner content: {needle}")

          path.write_text(text, encoding="utf-8")

      - name: Check JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          start_marker = "  <script>\n    (() => {"
          start = text.index(start_marker) + len("  <script>\n")
          end = text.rindex("\n  </script>")
          Path("/tmp/ib-start-app.js").write_text(text[start:end], encoding="utf-8")
      - run: node --check /tmp/ib-start-app.js

      - name: Commit runner and remove one-time workflow
        run: |
          rm .github/workflows/one-time-html-presentation-runner.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-html-presentation-runner.yml
          git commit -m "feat: add fullscreen HTML presentation runner"
          git push origin main
