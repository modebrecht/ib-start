name: One-time HTML presentation runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-html-presentation-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply HTML presentation runner patch
        run: python .github/runner_patch.py

      - name: Extract app JavaScript
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '  <script>\n    (() => {'
          start = text.index(marker) + len('  <script>\n')
          end = text.rindex('\n  </script>')
          Path('/tmp/ib-start-app.js').write_text(text[start:end], encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check /tmp/ib-start-app.js

      - name: Verify runner markers
        run: |
          grep -q 'data-html-runner-input' index.html
          grep -q 'data-presentation-stage' index.html
          grep -q 'textarea:not(\[data-no-store\])' index.html
          grep -q 'Pfeiltaste runter oder Leertaste = nächste Folie' index.html

      - name: Commit runner and clean temporary patch files
        run: |
          rm .github/workflows/one-time-html-presentation-runner.yml .github/runner_patch.py
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add index.html .github/workflows/one-time-html-presentation-runner.yml .github/runner_patch.py
          git commit -m "feat: add fullscreen HTML presentation runner"
          git push origin main
