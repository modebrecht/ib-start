name: One-time submission UI polish

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/polish_submission_ui.py'
      - '.github/workflows/one-time-polish-submission-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Polish submission UI
        run: python .github/scripts/polish_submission_ui.py
      - name: Validate main JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<script>\n    (() => {'
          a=s.find(marker)
          assert a >= 0
          a += len('<script>\n')
          b=s.find('</script>', a)
          assert b > a
          Path('/tmp/app.js').write_text(s[a:b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validate submission markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('class="runner-shortcuts"') == 1
          assert s.count('class="submission-files"') == 1
          assert '<kbd>Esc</kbd>' in s
          assert '<kbd>Leertaste</kbd>' in s
          assert 'html-runner-start html-runner-download' in s
          assert 'HTML-Datei' in s and 'PowerPoint-Datei (.pptx)' in s
          PY
      - name: Commit final change and remove one-time tooling
        run: |
          rm -f .github/scripts/polish_submission_ui.py .github/workflows/one-time-polish-submission-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/polish_submission_ui.py .github/workflows/one-time-polish-submission-ui.yml
          git commit -m 'fix: polish submission controls and key hints'
          git push origin HEAD:dev
